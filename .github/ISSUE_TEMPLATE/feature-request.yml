name: Improvement proposal
description: Propose a focused improvement to Resonance
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem needs to be solved? Include evidence when available.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what should become possible or more reliable.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Suggest an approach if you have one. The outcome matters more than this tactic.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing Resonance behavior or simpler options that may already solve the problem.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for this proposal.
          required: true
        - label: This proposal describes a problem and outcome, not only a preferred implementation.
          required: true
